<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ยิ้มสู้หนี้ · Google Login Test</title>

  <!-- Firebase SDK (compat version — ใช้งานง่าย ไม่ต้อง import) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'IBM Plex Sans Thai', sans-serif;
      background: linear-gradient(135deg, #0d1f91 0%, #1a34c4 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }

    /* ── CARD ── */
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 36px 28px;
      width: 100%; max-width: 380px;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
      text-align: center;
    }
    .logo { font-size: 52px; margin-bottom: 10px; }
    .title { font-size: 20px; font-weight: 700; color: #0d1f91; margin-bottom: 4px; }
    .sub   { font-size: 13px; color: #94a3b8; margin-bottom: 28px; }

    /* ── STATUS ── */
    .status {
      font-size: 13px; padding: 10px 14px;
      border-radius: 8px; margin-bottom: 16px; display: none;
    }
    .status.info  { background: #e8ecfd; color: #0d1f91; display: block; }
    .status.ok    { background: #e8f8e2; color: #0f6e56; display: block; }
    .status.error { background: #fee2e2; color: #dc2626; display: block; }

    /* ── SIGN IN BUTTON ── */
    .btn-google {
      width: 100%; padding: 13px;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      background: #fff; color: #1e293b;
      border: 1.5px solid #e2e8f0; border-radius: 10px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      font-family: inherit;
      transition: background .15s, box-shadow .15s;
    }
    .btn-google:hover { background: #f8fafc; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .btn-google:disabled { opacity: .5; cursor: not-allowed; }
    .btn-google svg { flex-shrink: 0; }

    /* ── USER PROFILE (แสดงหลัง login) ── */
    .profile { display: none; }
    .profile.show { display: block; }
    .profile-pic {
      width: 64px; height: 64px; border-radius: 50%;
      object-fit: cover; margin: 0 auto 10px;
      border: 3px solid #0d1f91;
      display: block;
    }
    .profile-name  { font-size: 16px; font-weight: 700; color: #1e293b; }
    .profile-email { font-size: 12px; color: #94a3b8; margin-top: 2px; margin-bottom: 16px; }

    /* ── RESULT BOX ── */
    .result-box {
      background: #f8fafc; border-radius: 10px;
      padding: 14px; margin: 16px 0;
      text-align: left; font-size: 12px; color: #475569;
      border: 1px solid #e2e8f0; display: none;
    }
    .result-box.show { display: block; }
    .result-row { display: flex; gap: 8px; margin-bottom: 6px; }
    .result-row:last-child { margin-bottom: 0; }
    .result-label { color: #94a3b8; width: 80px; flex-shrink: 0; }
    .result-val   { color: #1e293b; font-weight: 500; word-break: break-all; }

    /* ── ACTION BUTTONS ── */
    .btn-row { display: flex; gap: 8px; margin-top: 16px; }
    .btn {
      flex: 1; padding: 10px;
      border-radius: 8px; font-size: 13px; font-weight: 600;
      cursor: pointer; font-family: inherit; border: none;
    }
    .btn-primary   { background: #0d1f91; color: #fff; }
    .btn-secondary { background: #f1f5f9; color: #475569; }
    .btn-danger    { background: #fee2e2; color: #dc2626; }

    /* ── DIVIDER ── */
    .divider {
      display: flex; align-items: center; gap: 10px;
      margin: 20px 0; font-size: 12px; color: #94a3b8;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: #e2e8f0;
    }

    /* ── LOG ── */
    .log-box {
      background: #0d1f91; border-radius: 10px;
      padding: 12px 14px; margin-top: 20px;
      font-family: 'Courier New', monospace; font-size: 11px;
      color: #bfd0f7; text-align: left; max-height: 160px;
      overflow-y: auto; display: none;
    }
    .log-box.show { display: block; }
    .log-entry { margin-bottom: 3px; }
    .log-entry.ok  { color: #6ee7b7; }
    .log-entry.err { color: #fca5a5; }

    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%; animation: spin .7s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .badge {
      display: inline-block; font-size: 10px; padding: 2px 8px;
      border-radius: 99px; background: #e8f8e2; color: #0f6e56;
      font-weight: 600; margin-left: 6px; vertical-align: middle;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">😊</div>
  <div class="title">ยิ้มสู้หนี้ <span class="badge">TEST</span></div>
  <div class="sub">ทดสอบ Google Sign-In ผ่าน Firebase Auth</div>

  <!-- STATUS MESSAGE -->
  <div class="status info" id="status-msg">กำลังเชื่อมต่อ Firebase...</div>

  <!-- SIGN IN SECTION -->
  <div id="section-login">
    <button class="btn-google" id="btn-google" onclick="signInWithGoogle()" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      เข้าสู่ระบบด้วย Google
    </button>
  </div>

  <!-- PROFILE SECTION (แสดงหลัง login) -->
  <div class="profile" id="section-profile">
    <img class="profile-pic" id="profile-pic" src="" alt="profile">
    <div class="profile-name" id="profile-name">—</div>
    <div class="profile-email" id="profile-email">—</div>

    <div class="result-box show" id="result-box">
      <div class="result-row">
        <span class="result-label">Google UID</span>
        <span class="result-val" id="r-uid">—</span>
      </div>
      <div class="result-row">
        <span class="result-label">Display Name</span>
        <span class="result-val" id="r-name">—</span>
      </div>
      <div class="result-row">
        <span class="result-label">Email</span>
        <span class="result-val" id="r-email">—</span>
      </div>
      <div class="result-row">
        <span class="result-label">ID Token</span>
        <span class="result-val" id="r-token" style="font-size:10px;color:#94a3b8">กำลังดึง...</span>
      </div>
      <div class="result-row">
        <span class="result-label">Provider</span>
        <span class="result-val" id="r-provider">—</span>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" onclick="sendToGAS()">
        ▶ ส่งไป GAS (ทดสอบ)
      </button>
      <button class="btn btn-danger" onclick="signOut()">
        ออกจากระบบ
      </button>
    </div>
  </div>

  <!-- LOG -->
  <div class="log-box" id="log-box"></div>

</div>

<script>
// ============================================================
//  CONFIG — แก้ค่าเหล่านี้ด้วย Firebase project ของคุณ
// ============================================================
var FIREBASE_CONFIG = {
  apiKey:            "AIzaSyD9I15QhqPsl-8ybMyrFaGcP4u1HkdcKF4",
  authDomain:        "member-nuadthai.firebaseapp.com",
  projectId:         "member-nuadthai",
  appId:             "1:1009776261711:web:28ff1ea8ae86ed50e9483a"
};

// GAS URL สำหรับทดสอบส่ง token (ใส่ URL project หลักของคุณ)
var GAS_URL = "https://script.google.com/macros/s/AKfycbyv2nRwrrDjVGnMqqfLhI_HD3VzRpNyy2EggcFxNnunUkDr0jNIxEkMdKoMvFdMm77zSA/exec";

// ============================================================
//  INIT Firebase
// ============================================================
var auth;

function log(msg, type) {
  var box = document.getElementById('log-box');
  box.classList.add('show');
  var entry = document.createElement('div');
  entry.className = 'log-entry ' + (type || '');
  var time = new Date().toLocaleTimeString('th-TH');
  entry.textContent = '[' + time + '] ' + msg;
  box.appendChild(entry);
  box.scrollTop = box.scrollHeight;
}

function setStatus(msg, type) {
  var el = document.getElementById('status-msg');
  el.className = 'status ' + type;
  el.textContent = msg;
}

window.addEventListener('load', function() {
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    auth = firebase.auth();
    log('Firebase init OK', 'ok');
    setStatus('Firebase พร้อมแล้ว — กดปุ่มด้านล่างเพื่อทดสอบ', 'info');
    document.getElementById('btn-google').disabled = false;

    // ตรวจ auth state เมื่อโหลดหน้า (กรณี redirect กลับมา)
    auth.getRedirectResult()
      .then(function(result) {
        if (result && result.user) {
          log('getRedirectResult: พบ user จาก redirect', 'ok');
          handleUser(result.user);
        }
      })
      .catch(function(err) {
        if (err.code !== 'auth/no-auth-event') {
          log('getRedirectResult error: ' + err.message, 'err');
        }
      });

    // ตรวจ auth state สำหรับ persistent session
    auth.onAuthStateChanged(function(user) {
      if (user) {
        log('onAuthStateChanged: user = ' + user.email, 'ok');
        handleUser(user);
      } else {
        log('onAuthStateChanged: ไม่มี user');
        showLoginSection();
      }
    });

  } catch(e) {
    log('Firebase init ERROR: ' + e.message, 'err');
    setStatus('Firebase init ล้มเหลว: ' + e.message, 'error');
  }
});

// ============================================================
//  SIGN IN — ลอง popup ก่อน ถ้า block ใช้ redirect
// ============================================================
function signInWithGoogle() {
  var provider = new firebase.auth.GoogleAuthProvider();
  provider.addScope('profile');
  provider.addScope('email');

  setStatus('กำลังเปิดหน้าต่าง Google...', 'info');
  document.getElementById('btn-google').disabled = true;
  log('เรียก signInWithPopup...');

  auth.signInWithPopup(provider)
    .then(function(result) {
      log('Popup login สำเร็จ: ' + result.user.email, 'ok');
      // handleUser ถูกเรียกจาก onAuthStateChanged แล้ว
    })
    .catch(function(err) {
      if (err.code === 'auth/popup-blocked' || err.code === 'auth/popup-closed-by-user') {
        // Popup ถูก block → ใช้ redirect แทน
        log('Popup ถูก block → ใช้ redirect แทน', 'err');
        setStatus('Popup ถูก block — กำลัง redirect...', 'info');
        auth.signInWithRedirect(provider);
      } else {
        log('Login error: ' + err.code + ' — ' + err.message, 'err');
        setStatus('เกิดข้อผิดพลาด: ' + err.message, 'error');
        document.getElementById('btn-google').disabled = false;
      }
    });
}

// ============================================================
//  HANDLE USER — แสดงข้อมูลหลัง login
// ============================================================
function handleUser(user) {
  setStatus('เข้าสู่ระบบสำเร็จ ✓', 'ok');

  // แสดง profile
  var pic = document.getElementById('profile-pic');
  if (user.photoURL) {
    pic.src = user.photoURL;
    pic.style.display = 'block';
  } else {
    pic.style.display = 'none';
  }

  document.getElementById('profile-name').textContent  = user.displayName || '—';
  document.getElementById('profile-email').textContent = user.email || '—';
  document.getElementById('r-uid').textContent         = user.uid;
  document.getElementById('r-name').textContent        = user.displayName || '—';
  document.getElementById('r-email').textContent       = user.email || '—';
  document.getElementById('r-provider').textContent    = user.providerData[0]
    ? user.providerData[0].providerId : '—';

  // ดึง ID Token (ใช้ส่งยืนยันตัวตนกับ GAS ได้)
  user.getIdToken()
    .then(function(token) {
      document.getElementById('r-token').textContent = token.substring(0, 40) + '...';
      log('ID Token ดึงแล้ว (แสดง 40 ตัวแรก)', 'ok');
    })
    .catch(function(e) {
      document.getElementById('r-token').textContent = 'ดึงไม่ได้: ' + e.message;
    });

  showProfileSection();
  log('แสดงข้อมูล user: ' + user.uid.substring(0,8) + '...', 'ok');
}

// ============================================================
//  ทดสอบส่งข้อมูลไป GAS
// ============================================================
function sendToGAS() {
  var uid  = document.getElementById('r-uid').textContent;
  var name = document.getElementById('r-name').textContent;
  var email = document.getElementById('r-email').textContent;

  if (!uid || uid === '—') {
    log('ยังไม่มีข้อมูล user', 'err');
    return;
  }

  log('กำลังส่งข้อมูลไป GAS...');
  setStatus('กำลังทดสอบส่งข้อมูลไป GAS...', 'info');

  // ทดสอบด้วย action=google_login (GAS ยังไม่รองรับ — เพื่อดู response)
  var url = GAS_URL
    + '?action=google_login'
    + '&googleUid='    + encodeURIComponent(uid)
    + '&displayName='  + encodeURIComponent(name)
    + '&email='        + encodeURIComponent(email);

  fetch(url)
    .then(function(res) { return res.json(); })
    .then(function(data) {
      log('GAS response: ' + JSON.stringify(data), 'ok');
      setStatus('GAS ตอบกลับแล้ว — ดูผลใน log', 'ok');
    })
    .catch(function(err) {
      log('GAS ยังไม่รองรับ google_login (ปกติสำหรับการทดสอบ): ' + err.message, 'err');
      setStatus('Google login ทำงานได้ — GAS ยังรอ implement', 'info');
    });
}

// ============================================================
//  SIGN OUT
// ============================================================
function signOut() {
  auth.signOut()
    .then(function() {
      log('Sign out สำเร็จ');
      setStatus('ออกจากระบบแล้ว', 'info');
      showLoginSection();
    })
    .catch(function(e) {
      log('Sign out error: ' + e.message, 'err');
    });
}

// ============================================================
//  UI HELPERS
// ============================================================
function showLoginSection() {
  document.getElementById('section-login').style.display  = 'block';
  document.getElementById('section-profile').className    = 'profile';
  document.getElementById('btn-google').disabled = false;
}

function showProfileSection() {
  document.getElementById('section-login').style.display  = 'none';
  document.getElementById('section-profile').className    = 'profile show';
}
</script>

</body>
</html>

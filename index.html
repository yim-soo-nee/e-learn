<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ยิ้มสู้หนี้ · ห้องเรียนออนไลน์</title>

  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; }
    body { font-family: 'IBM Plex Sans Thai', 'Noto Sans Thai', sans-serif; }

    /* ── LOADING ─────────────────────────────── */
    #loading {
      position:fixed; inset:0; z-index:200;
      background:#0d1f91;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:14px;
      transition: opacity .4s ease;
    }
    #loading.hide { opacity:0; pointer-events:none; }
    #loading img  { width:72px; height:72px; object-fit:contain; }
    #loading .ttl { font-size:18px; font-weight:700; color:#fff; }
    #loading .sub { font-size:13px; color:rgba(255,255,255,.6); }
    #loading .spinner {
      width:28px; height:28px;
      border:3px solid rgba(255,255,255,.2);
      border-top-color:#fff; border-radius:50%;
      animation:spin .8s linear infinite;
    }
    #loading .msg { font-size:13px; color:rgba(255,255,255,.85); }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* ── ERROR ───────────────────────────────── */
    #error-screen {
      position:fixed; inset:0; z-index:150;
      background:#f1f5f9;
      display:none; flex-direction:column;
      align-items:center; justify-content:center;
      gap:14px; padding:32px; text-align:center;
    }
    #error-screen .err-icon { font-size:44px; }
    #error-screen h2 { font-size:17px; color:#0d1f91; font-weight:700; }
    #error-screen p  { font-size:13px; color:#64748b; line-height:1.6; }
    #error-screen button {
      padding:11px 28px; background:#0d1f91; color:#fff;
      border:none; border-radius:10px; font-size:14px;
      font-weight:600; cursor:pointer; font-family:inherit;
    }

    /* ── CHOOSE SCREEN (เลือก login method) ─── */
    #choose-screen {
      position:fixed; inset:0; z-index:100;
      background:linear-gradient(160deg,#0d1f91 0%,#1a34c4 100%);
      display:none; flex-direction:column;
      align-items:center; justify-content:center;
      gap:0; padding:32px;
    }
    #choose-screen .logo   { font-size:52px; margin-bottom:10px; }
    #choose-screen .ttl    { font-size:20px; font-weight:700; color:#fff; margin-bottom:4px; }
    #choose-screen .sub    { font-size:13px; color:rgba(255,255,255,.65); margin-bottom:32px; }

    .btn-login {
      width:100%; max-width:320px;
      display:flex; align-items:center; justify-content:center; gap:10px;
      padding:14px 20px; border-radius:12px;
      font-size:15px; font-weight:700;
      cursor:pointer; font-family:inherit; border:none;
      margin-bottom:12px;
      transition:transform .15s, box-shadow .15s;
    }
    .btn-login:hover { transform:translateY(-1px); box-shadow:0 6px 20px rgba(0,0,0,.2); }
    .btn-login:active { transform:translateY(0); }
    .btn-login:disabled { opacity:.5; cursor:not-allowed; transform:none; }

    .btn-line   { background:#06C755; color:#fff; }
    .btn-google { background:#fff; color:#1e293b; }

    .divider {
      display:flex; align-items:center; gap:10px;
      width:100%; max-width:320px; margin-bottom:12px;
      font-size:12px; color:rgba(255,255,255,.4);
    }
    .divider::before, .divider::after {
      content:''; flex:1; height:1px;
      background:rgba(255,255,255,.2);
    }

    .notice {
      font-size:11px; color:rgba(255,255,255,.4);
      text-align:center; margin-top:8px; max-width:280px;
      line-height:1.5;
    }

    /* ── APP IFRAME ──────────────────────────── */
    #app-frame {
      position:fixed; top:0; left:0;
      width:100%; height:100%;
      border:none; display:none;
    }
  </style>
</head>
<body>

<!-- Loading -->
<div id="loading">
  <img src="https://lh3.googleusercontent.com/d/1rCJPNfrf96621kkleh7rYAj4VnSg1r48"
       alt="ยิ้มสู้หนี้" onerror="this.style.display='none'">
  <div class="ttl">ยิ้มสู้หนี้</div>
  <div class="sub">ห้องเรียนออนไลน์</div>
  <div class="spinner"></div>
  <div class="msg" id="loading-msg">กำลังตรวจสอบ...</div>
</div>

<!-- Error -->
<div id="error-screen">
  <div class="err-icon">⚠️</div>
  <h2>เกิดข้อผิดพลาด</h2>
  <p id="error-msg">ไม่สามารถเชื่อมต่อระบบได้<br>กรุณาลองใหม่</p>
  <button onclick="location.reload()">ลองใหม่</button>
</div>

<!-- Choose Login Method -->
<div id="choose-screen">
  <div class="logo">😊</div>
  <div class="ttl">ยิ้มสู้หนี้</div>
  <div class="sub">ห้องเรียนออนไลน์ · คู่มือแก้หนี้ด้วยตัวเอง</div>

  <button class="btn-login btn-line" id="btn-line" onclick="loginWithLine()">
    <svg viewBox="0 0 24 24" fill="currentColor" style="width:22px;height:22px">
      <path d="M19.952 12.475c0-4.417-4.428-8.008-9.872-8.008S.208 8.058.208 12.475c0 3.96 3.511 7.278 8.252 7.907.322.07.759.21.87.483.1.248.065.637.032.888l-.14.844c-.043.248-.197.97.85.529 1.047-.442 5.65-3.328 7.707-5.697 1.422-1.56 2.173-3.143 2.173-4.954z"/>
    </svg>
    เข้าสู่ระบบด้วย LINE
  </button>

  <div class="divider">หรือ</div>

  <button class="btn-login btn-google" id="btn-google" onclick="loginWithGoogle()">
    <svg width="20" height="20" viewBox="0 0 24 24">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
    </svg>
    เข้าสู่ระบบด้วย Google
  </button>

  <div class="notice">
    ครั้งแรกที่เข้า ระบบจะสร้างบัญชีให้อัตโนมัติ<br>
    ไม่ต้องสมัครสมาชิกล่วงหน้า
  </div>
</div>

<!-- App iframe -->
<iframe id="app-frame" allow="fullscreen"></iframe>

<script>
// ============================================================
//  CONFIG — แก้ค่าเหล่านี้เท่านั้น
// ============================================================
var LIFF_ID = '2006491477-lMQxonNr';
var GAS_URL = 'https://script.google.com/macros/s/AKfycbyv2nRwrrDjVGnMqqfLhI_HD3VzRpNyy2EggcFxNnunUkDr0jNIxEkMdKoMvFdMm77zSA/exec';

var FIREBASE_CONFIG = {
  apiKey:     'AIzaSyD9I15QhqPsl-8ybMyrFaGcP4u1HkdcKF4',
  authDomain: 'member-nuadthai.firebaseapp.com',
  projectId:  'member-nuadthai',
  appId:      '1:1009776261711:web:28ff1ea8ae86ed50e9483a'
};

// ============================================================
//  UTILS
// ============================================================
function setMsg(msg) {
  var el = document.getElementById('loading-msg');
  if (el) el.textContent = msg;
}

function showLoading(msg) {
  document.getElementById('loading').classList.remove('hide');
  document.getElementById('loading').style.display = 'flex';
  document.getElementById('choose-screen').style.display = 'none';
  if (msg) setMsg(msg);
}

function showChoose() {
  document.getElementById('loading').classList.add('hide');
  setTimeout(function() {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('choose-screen').style.display = 'flex';
  }, 400);
}

function showError(msg) {
  document.getElementById('loading').classList.add('hide');
  document.getElementById('choose-screen').style.display = 'none';
  var err = document.getElementById('error-screen');
  err.style.display = 'flex';
  document.getElementById('error-msg').innerHTML = msg || 'เกิดข้อผิดพลาด กรุณาลองใหม่';
}

function launchApp(token) {
  var url = GAS_URL + '?liff_token=' + encodeURIComponent(token);
  var frame = document.getElementById('app-frame');
  frame.src = url;
  frame.style.display = 'block';
  frame.onload = function() {
    document.getElementById('loading').classList.add('hide');
    setTimeout(function() {
      document.getElementById('loading').style.display = 'none';
    }, 450);
  };
}

function callGAS(action, params) {
  // ใช้ JSONP แทน fetch() เพื่อ bypass CORS ของ GAS
  // GAS ไม่ส่ง Access-Control-Allow-Origin → fetch() ถูก block
  // JSONP ใช้ <script src="..."> ซึ่งไม่ถูก CORS จำกัด
  return new Promise(function(resolve, reject) {
    var cbName = '_gasCb_' + Date.now();
    var script = document.createElement('script');
    var timer;

    // GAS จะ return: callback({ ok:true, token:"..." })
    window[cbName] = function(data) {
      clearTimeout(timer);
      document.head.removeChild(script);
      delete window[cbName];
      resolve(data);
    };

    var url = GAS_URL + '?action=' + action + '&callback=' + cbName;
    Object.keys(params).forEach(function(k) {
      url += '&' + k + '=' + encodeURIComponent(params[k] || '');
    });

    script.src = url;
    script.onerror = function() {
      clearTimeout(timer);
      document.head.removeChild(script);
      delete window[cbName];
      reject(new Error('Script load error'));
    };

    // timeout 15 วินาที
    timer = setTimeout(function() {
      if (document.head.contains(script)) document.head.removeChild(script);
      delete window[cbName];
      reject(new Error('Timeout'));
    }, 15000);

    document.head.appendChild(script);
  });
}

// ============================================================
//  INIT — ตรวจทั้ง LINE context และ Firebase redirect result
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
  showLoading('กำลังตรวจสอบ...');

  // ── Init Firebase ──
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
  } catch(e) {
    console.error('Firebase init failed:', e);
  }

  var auth = firebase.auth();

  // ── ตรวจ Google redirect result ก่อน (กรณีเด้งกลับมาจาก Google) ──
  auth.getRedirectResult()
    .then(function(result) {
      if (result && result.user) {
        // เด้งกลับมาจาก Google Sign-In
        setMsg('กำลังเข้าสู่ระบบด้วย Google...');
        return handleGoogleUser(result.user);
      }

      // ── ไม่มี redirect result → ตรวจ LINE context ──
      return checkLineContext();
    })
    .catch(function(err) {
      console.error('getRedirectResult error:', err);
      // ไม่ใช่ redirect → ตรวจ LINE ต่อ
      checkLineContext();
    });
});

// ============================================================
//  LINE — ตรวจว่าเปิดใน LINE หรือไม่
// ============================================================
function checkLineContext() {
  setMsg('กำลังตรวจสอบ LINE...');

  liff.init({ liffId: LIFF_ID })
    .then(function() {
      if (liff.isInClient() && liff.isLoggedIn()) {
        // เปิดใน LINE Browser → auto-login ทันที
        setMsg('กำลังดึงข้อมูล LINE...');
        return liff.getProfile();
      } else {
        // เบราว์เซอร์ปกติ → แสดงหน้าเลือก login method
        showChoose();
        return null;
      }
    })
    .then(function(profile) {
      if (!profile) return;
      setMsg('กำลังเข้าสู่ระบบด้วย LINE...');
      callGAS('liff_login', {
        lineUserId:      profile.userId,
        lineDisplayName: profile.displayName
      })
      .then(function(data) {
        if (data && data.ok && data.token) {
          launchApp(data.token);
        } else {
          showError((data && data.message) || 'LINE login ไม่สำเร็จ');
        }
      })
      .catch(function() { showError('ไม่สามารถเชื่อมต่อระบบได้'); });
    })
    .catch(function(err) {
      console.error('[LIFF] init error:', err);
      // LIFF init ล้มเหลว → แสดงเลือก login
      showChoose();
    });
}

// ============================================================
//  LINE — กดปุ่มจากหน้าเลือก (กรณีเบราว์เซอร์)
// ============================================================
function loginWithLine() {
  document.getElementById('btn-line').disabled = true;
  showLoading('กำลังพาไปยัง LINE Login...');
  liff.login();
}

// ============================================================
//  GOOGLE — กดปุ่มจากหน้าเลือก
// ============================================================
function loginWithGoogle() {
  document.getElementById('btn-google').disabled = true;
  showLoading('กำลังเปิดหน้าต่าง Google...');

  var auth     = firebase.auth();
  var provider = new firebase.auth.GoogleAuthProvider();
  provider.addScope('profile');
  provider.addScope('email');

  // ลอง Popup ก่อน — ถ้า block ใช้ Redirect
  auth.signInWithPopup(provider)
    .then(function(result) {
      setMsg('กำลังเข้าสู่ระบบด้วย Google...');
      return handleGoogleUser(result.user);
    })
    .catch(function(err) {
      if (err.code === 'auth/popup-blocked' ||
          err.code === 'auth/popup-closed-by-user') {
        setMsg('กำลัง redirect ไปยัง Google...');
        auth.signInWithRedirect(provider);
      } else {
        console.error('Google login error:', err);
        showError('Google Login ล้มเหลว:<br>' + (err.message || 'กรุณาลองใหม่'));
        document.getElementById('btn-google').disabled = false;
        showChoose();
      }
    });
}

// ============================================================
//  GOOGLE — ส่ง UID ไป GAS
// ============================================================
function handleGoogleUser(user) {
  setMsg('กำลังเข้าสู่ระบบ...');
  return callGAS('google_login', {
    googleUid:   user.uid,
    displayName: user.displayName || '',
    email:       user.email || ''
  })
  .then(function(data) {
    if (data && data.ok && data.token) {
      setMsg('เข้าสู่ระบบสำเร็จ!');
      launchApp(data.token);
    } else {
      showError((data && data.message) || 'Google login ไม่สำเร็จ');
    }
  })
  .catch(function(err) {
    console.error('GAS google_login error:', err);
    showError('ไม่สามารถเชื่อมต่อระบบได้');
  });
}
</script>

</body>
</html>
